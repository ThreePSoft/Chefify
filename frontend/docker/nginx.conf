server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/javascript application/json application/wasm image/svg+xml text/css;

  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location = /version.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location ~* \.(?:mjs|js|wasm|json)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location ~* \.(?:css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
